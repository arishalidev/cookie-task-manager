<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cookie Task Manager</title>
    <link href="./dist/output.css" rel="stylesheet">
    <script src="./dist/index.js" defer></script>
</head>
<body class="bg-brown-100">
<div class="flex">
    <div class="w-60 shrink-0 bg-brown-200">
        <aside class="px-4 py-2">
            <div class="flex mx-3 p-2">
                <div>
                    <button class="w-40 text-left" type="button">Bob's Bakery</button>
                </div>
                <div>
                    <button class="px-2 hover:bg-brown-300 rounded-xl"
                            type="button"
                            id="newOven"
                            popovertarget="newOvenModal"
                            style="anchor-name: --newOvenAnchor">
                        ➕
                    </button>

                </div>
            </div>

            <div
                    popover
                    id="newOvenModal"
                    class="bg-brown-400 fixed left-[anchor(right)] top-[anchor(bottom)] -ml-2 -mt-2 rounded-2xl p-4"
                    style="position-anchor: --newOvenAnchor">
                <form id="newOvenForm">
                    <div>
                        <div class="flex">
                            <div>
                                <label>
                                    Title:
                                    <input name="title" class="bg-brown-300 rounded-md m-2 px-2 py-1" type="text">
                                </label>
                            </div>
                            <div>
                                <button class="bg-brown-300 rounded-md m-2 px-2 py-1" id="setTag">🏷️</button>
                                <button class="bg-brown-300 rounded-md m-2 px-2 py-1" id="setPriority">⭐</button>
                            </div>
                        </div>
                        <div>
                            <label>
                                Description:
                                <br>
                                <textarea
                                        name="description"
                                        class="bg-brown-300 rounded-md my-2 px-2 py-1 w-full"
                                        rows="3"></textarea>
                            </label>
                        </div>
                        <div>
                            <p>Cookies:</p>
                            <label>
                                - <input name="cookies" class="bg-brown-300 rounded-md m-2 px-2 py-1" type="text"> <br>
                                - <input name="cookies" class="bg-brown-300 rounded-md m-2 px-2 py-1" type="text"> <br>
                                - <input name="cookies" class="bg-brown-300 rounded-md m-2 px-2 py-1" type="text">

                            </label>
                        </div>
                        <div class="flex justify-end">
                            <button class="bg-brown-200 rounded-md m-2 px-2 py-1" type="submit">Cancel</button>
                            <button class="bg-brown-200 rounded-md m-2 px-2 py-1" type="submit">Create</button>
                        </div>
                    </div>
                </form>

            </div>

            <div>
                <div class="p-2 mx-3 my-1 hover:bg-brown-300 rounded-xl">
                    <button type="button">
                        <span class="p-1">🔍</span>
                        <span class="p-1">Search</span>
                    </button>
                </div>

                <div class="sidebar-list">
                    <div class="sidebar-dropdown">
                        <button>Priority</button>
                    </div>

                    <ul>
                        <li>
                            <button>High</button>
                        </li>
                        <li>
                            <button>Medium</button>
                        </li>
                        <li>
                            <button>Low</button>
                        </li>
                    </ul>
                </div>
                <div class="sidebar-list">
                    <div class="sidebar-dropdown">
                        <button>Tagged</button>
                    </div>
                    <ul>
                        <li>
                            <button>Red</button>
                        </li>
                        <li>
                            <button>Orange</button>
                        </li>
                        <li>
                            <button>Yellow</button>
                        </li>
                        <li>
                            <button>Green</button>
                        </li>
                        <li>
                            <button>Blue</button>
                        </li>
                        <li>
                            <button>Violet</button>
                        </li>
                    </ul>
                </div>

                <div class="sidebar-list">
                    <div class="sidebar-dropdown">
                        <button>Doneness</button>
                    </div>

                    <ul>
                        <li>
                            <button>Raw</button>
                        </li>
                        <li>
                            <button>Gooey</button>
                        </li>
                        <li>
                            <button>Chewy</button>
                        </li>
                        <li>
                            <button>Crisp</button>
                        </li>
                        <li>
                            <button>Eaten</button>
                        </li>
                    </ul>
                </div>

            </div>

        </aside>
    </div>
    <div class="grow">
        <h1 class="text-4xl text-center my-6">Ovens</h1>
        <div class="grid grid-cols-1 md:grid-cols-2">
            <div class="m-4 p-3 bg-brown-200 rounded-2xl">
                <a href="./oven.html">
                    <div class="flex">
                        <h2 class="text-2xl flex-1 text-center">School</h2>
                        <div class="w-16 text-center">
                            <button>Menu</button>
                        </div>
                    </div>
                    <div class="my-2 p-3 bg-brown-300 rounded-2xl">
                        <ul>
                            <li>Complete Lin Alg Homework</li>
                            <li>Find out when to meet with 3600 team</li>
                        </ul>
                    </div>
                </a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
